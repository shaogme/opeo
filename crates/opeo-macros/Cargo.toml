[package]
name = "opeo-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Procedural macros for the opeo crate"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/opeo-macros"
keywords = ["error-handling", "proc-macro", "out-parameters"]
categories = ["development-tools"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
proc-macro-crate = "3"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }

[lints]
workspace = true

